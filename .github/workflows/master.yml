
name: Hola, este es mi portafolio

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - 'PortafolioJMEC/**'
      - '.github/workflows/master.yml'

  pull_request:
    branches:
      - master

jobs:
  saludar:
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar información del portafolio
        run: echo "Hola, este es mi portafolio, 3ro ISI"

      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Listar los archivos del repositorio
        run: |
          echo "El repositorio ${{ github.repository }} contiene los siguientes archivos:"
          ls -la
