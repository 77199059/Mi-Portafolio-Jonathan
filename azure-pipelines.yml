# Disparador: se ejecuta automáticamente en cada 'git push' a la rama master
trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'Build Web App'
  jobs:
  - job: BuildJob
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.x'   # Ajusta según la versión de .NET que uses

    - script: dotnet restore
      displayName: 'Restaurar dependencias'

    - script: dotnet build --configuration Release
      displayName: 'Compilar proyecto'

    - script: dotnet publish --configuration Release --output $(Build.ArtifactStagingDirectory)
      displayName: 'Publicar proyecto ASP.NET Core'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Deploy to Azure App Service'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: DeployJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - download: current
      artifact: drop

    - task: AzureWebApp@1
      inputs:
        azureSubscription: 'ConexionAzure'   # Nombre de tu conexión de servicio
        appType: 'webApp'
        appName: 'devop-Mi-Portafolio-Jonathan'
        package: '$(Pipeline.Workspace)/drop'   # Carpeta publicada, no ZIP
